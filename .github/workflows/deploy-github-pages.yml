# Deploys the app to GitHub Pages on every push. Enable once in the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The Supabase URL and anon key are publishable values (row-level security protects the data);
# repository secrets with the same names override them. VITE_PROXY_URL (Claude) is optional.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/upbeat-babbage-stmr4v]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*' }
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: /planning/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://khpddtxiyacrivlliwdw.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_yuJyQbBhncz0QdwfwokERQ_vIx27mJS' }}
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }
  deploy:
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
