# Supabase's free tier pauses a project after ~7 days without traffic, which makes the
# app fail with "Failed to fetch". A daily read keeps it counted as active.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database through the public API
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL || 'https://khpddtxiyacrivlliwdw.supabase.co' }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_yuJyQbBhncz0QdwfwokERQ_vIx27mJS' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/families?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $code"
          # 200 (rows) or 401/403 (RLS, no session) both prove the project is awake; 5xx or 000 means it is not.
          case "$code" in 200|401|403|406) exit 0 ;; *) exit 1 ;; esac
