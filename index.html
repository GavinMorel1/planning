<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#171738" />
    <title>Paradiem Planning</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #171738; color: #FAF7F2;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none; font-feature-settings: 'cv01' on, 'cv02' on;
      }
      ::selection { background: rgba(201, 168, 76, 0.40); color: #FAF7F2; }
      #app-splash { position: fixed; inset: 0; z-index: 9999; background: #1F1F45; display: flex; align-items: center; justify-content: center; }
      #app-splash img { width: 240px; height: auto; animation: splash-pulse 1.8s ease-in-out infinite; }
      @keyframes splash-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="app-splash"><img src="paradiem-logo-dark.png" alt="Paradiem" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // If the app has not mounted within 8 seconds, say so instead of pulsing forever.
      (function () {
        setTimeout(function () {
          var splash = document.getElementById('app-splash');
          var root = document.getElementById('root');
          if (!splash || (root && root.childNodes.length)) return;
          var mod = document.querySelector('script[type=module]');
          var src = mod ? mod.getAttribute('src') : '(none)';
          splash.innerHTML = '<div style="max-width:440px;text-align:center;font-family:DM Sans,sans-serif;color:#FAF7F2;padding:24px">'
            + '<div style="font-size:18px;font-weight:700;margin-bottom:8px">The app did not load</div>'
            + '<div style="font-size:13px;color:#B8B4AC;line-height:1.6;margin-bottom:18px">Your browser may be holding an old copy of this page. Press <b>Ctrl+Shift+R</b> (Windows) or <b>Cmd+Shift+R</b> (Mac), or open the address in a private window.</div>'
            + '<button onclick="location.reload(true)" style="padding:10px 22px;border-radius:10px;border:1px solid #C9A84C;background:#C9A84C;color:#171738;font-weight:700;cursor:pointer;font-family:inherit">Reload</button>'
            + '<div style="font-size:10px;color:#8B7355;margin-top:18px;word-break:break-all">script: ' + src + '</div></div>';
        }, 8000);
      })();
    </script>
  </body>
</html>
